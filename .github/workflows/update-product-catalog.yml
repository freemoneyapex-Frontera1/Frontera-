name: Refresh FRONTERA product catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh approved product feeds
        run: python scripts/update_catalog.py
      - name: Publish catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh FRONTERA product prices and availability"
            git push
          else
            echo "No catalog changes to publish."
          fi
